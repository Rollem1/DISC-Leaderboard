<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Overlay</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css" media="(max-width: 768px)">
</head>

<body>

  <!-- Two-line top banner -->
  <div id="topBanner">
    <div id="bannerLine1"></div> <!-- Competition name -->
    <div id="bannerLine2"></div> <!-- Category / Warmup / Leaderboard -->
  </div>

  <!-- Views -->
  <div id="scoreboardView" class="view">
    <div id="currentSkater"></div>
    <div id="nextSkater"></div>

    <div id="leaderboard"></div>

    <div id="scrollWrapper">
      <div id="scrollingList"></div>
    </div>
  </div>

  <div id="warmupView" class="view">
    <div id="warmupList" class="scroll-container"></div>
  </div>

  <div id="messageView" class="view">
    <div id="generalMessage"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
