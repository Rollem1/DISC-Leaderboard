<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Overlay</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css" media="(max-width: 768px)">
</head>

<body>

  <div id="overlayRoot">

    <!-- Two-line top banner -->
    <div id="topBanner">
      <div id="bannerLine1"></div>
      <div id="bannerLine2"></div>
    </div>

    <!-- Scoreboard View -->
    <div id="scoreboardView" class="view">
      <div id="currentSkater"></div>
      <div id="nextSkater"></div>

      <div id="leaderboard"></div>

      <div id="scrollWrapper">
        <div id="scrollingList"></div>
      </div>
    </div>

    <!-- Warmup View -->
    <div id="warmupView" class="view">
      <div class="scroll-container">
        <div id="warmupList"></div>
      </div>
    </div>

    <!-- Message View -->
    <div id="messageView" class="view">
      <div id="generalMessage"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
